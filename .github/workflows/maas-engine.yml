name: maas-engine CI/CD

# Thin caller for the maas-engine package. Wires the reusable building blocks
# from the workflow-catalog repo:
#   python-ci.yml — test (pytest + SonarQube) -> build (wheel/sdist) -> publish to Nexus
#   sbom.yml      — package CycloneDX SBOM -> Dependency-Track
#
# The package lives at the repo root, so project-dir is ".".
#
# Triggers:
#   push to develop   -> ci (test/build/publish to Nexus dev) + package SBOM (dev)
#   push tag x.y.z    -> ci (test/build/publish to Nexus prod) + package SBOM (prod)
#   workflow_dispatch -> manual run
#
# Runs on the containerized runners (runs-on below), which reach OpenBao.
#
# CI values come from OpenBao, not from the GitHub organisation secrets (since
# 2026-10-22): each job logs in with its GitHub OIDC token as ci-maas-engine
# (ci-maas-engine-release on a tag build) and reads only the tools it lists in
# openbao-tools, from devsecops/ci/<dev|prod>/<tool>. Values, roles and policies:
# the platform repository's OpenBao configuration.

on:
  push:
    branches:
      - "develop"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+" # release tags (x.y.z)
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Test, build the wheel/sdist, publish to Nexus. Exposes `version`.
  ci:
    permissions:
      contents: read
      id-token: write # the OIDC token the jobs log in to OpenBao with
    uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/workflows/python-ci.yml@develop
    with:
      runs-on: containerized # the runners on the ocs_openbao network
      secrets-source: openbao
      openbao-role: ci-maas-engine
      openbao-tools: nexus sonarqube
      project-dir: .
      python-version: "3.11"
    # No secrets: inherit: in openbao mode the catalog reads every value from OpenBao.

  # Package SBOM -> Dependency-Track project "maas-engine".
  # Consumes the `dist` artifact built by ci. Uses the prod Nexus context on
  # release tags, dev otherwise.
  sbom:
    needs: ci
    permissions:
      contents: read
      id-token: write # the OIDC token the jobs log in to OpenBao with
    uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/workflows/sbom.yml@develop
    with:
      runs-on: containerized # the runners on the ocs_openbao network
      secrets-source: openbao
      openbao-role: ci-maas-engine
      openbao-tools: nexus dependency-track
      project-dir: .
      project-name: maas-engine
      project-version: ${{ needs.ci.outputs.version }}
      python-version: "3.11"
      context: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
    # No secrets: inherit: in openbao mode the catalog reads every value from OpenBao.
